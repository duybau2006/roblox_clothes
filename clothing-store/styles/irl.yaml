      - {base: "#2B2B2B", shadow: "#1F1F1F", highlight: "#515151"}
      - {base: "#F3EBDD", shadow: "#AFA99F", highlight: "#F5EFE3"}
      - {base: "#2E4A36", shadow: "#213527", highlight: "#546B5A"}
      - {base: "#D9A93F", shadow: "#9C7A2D", highlight: "#E0B862"}
  avoid: [checkerboard side stripe or wave-stripe shoe marks resembling skate brands, skate-brand box logos]

- id: checks-tartan
