  palette:
    - "#B22222"  # red (with black)
    - "#111111"  # black
    - "#1F4D2E"  # green (with navy)
    - "#1C2A4A"  # navy
  shirts: [plaid shirt, tartan jacket]
  pants: [plaid trousers, tartan skirt]
  details: [checks aligned across seams (the main quality test)]
  keywords: [plaid, tartan, checkered]
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Plaid: folds show as shading only, never bend the pattern (it must stay aligned across seams)."
    build: "Plaid shirt: base_pattern plaid, button placket and collar in the same check, chest pockets cut on the bias (diagonal check). Tartan skirt: pleats every 8 px, kilt pin as a small bar. The check period (32 px) is fixed so it wraps seamlessly."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#B22222", shadow: "#801818", highlight: "#C04A4A"}
      - {base: "#111111", shadow: "#0C0C0C", highlight: "#3C3C3C"}
      - {base: "#1F4D2E", shadow: "#163721", highlight: "#476D54"}
      - {base: "#1C2A4A", shadow: "#141E35", highlight: "#45506B"}
  avoid: [camel/black/red/white house check resembling a luxury brand, registered clan tartans copied exactly]

