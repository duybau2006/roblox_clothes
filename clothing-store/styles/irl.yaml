# Style library A: real-life styles.
# palette: max 4 colours plus a neutral; hex values are starting points, the comment names the colour.

- id: streetwear
  name: Streetwear
  palette:
    - "#111111"  # black
    - "#8A8A8A"  # grey
    - "#F5F5F5"  # white
    - "#FF5A1F"  # loud accent (swap per design)
  shirts: [oversized hoodie, graphic-free boxy tee, bomber jacket]
  pants: [baggy cargos, wide jeans]
  details: [drawstrings, kangaroo pocket, chunky sneakers]
  keywords: [streetwear, baggy, oversized]
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Oversized: deep drop-shoulder fold at the top of the arm, long vertical drape folds down the torso sides, heavy stacking at cuffs and pant hems; baggy legs break into 2-3 wide folds above the shoe."
    build: "Hoodie: hood laid flat on the back, kangaroo pocket with slanted openings, 12 px rib hem and cuffs. Boxy tee: wide crew rib 5 px, short sleeve hem at arm v~40. Bomber: rib collar/cuffs/hem in trim colour, centre zip as a 1.5 px line with a darker placket. Cargos: bellows pocket on the outer thigh (outer face, v 40-70) with a flap shadow."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#111111", shadow: "#0C0C0C", highlight: "#3C3C3C"}
      - {base: "#8A8A8A", shadow: "#636363", highlight: "#9F9F9F"}
      - {base: "#F5F5F5", shadow: "#B0B0B0", highlight: "#F7F7F7"}
      - {base: "#FF5A1F", shadow: "#B84116", highlight: "#FF7847"}
  avoid: [brand-like logos or chest marks, hype-brand box labels, slogan text]

- id: y2k
  name: Y2K
  palette:
    - "#F7B6D2"  # baby pink
    - "#8FD3FF"  # sky blue
    - "#C9CED6"  # silver
    - "#B8F04A"  # lime
  shirts: [cropped baby tee, zip hoodie, halter-style top]
  pants: [low-rise flared jeans, cargo pants, mini skirt over leggings]
  details: [star shapes, butterfly shapes, belts, platform shoes]
  keywords: [y2k, 2000s, baby tee]
  guide: guides/y2k.md
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Fitted tops: small tension folds radiating from the bust toward the side seams; low-rise jeans: whisker creases fanning from the crotch, flares widen and fold above the shoe."
    build: "Baby tee: cropped with torso.hem_line ~88 over a high waistband (legs.waist_line ~100, gap max 16 px), short sleeves; contrast 3 px rib neck and sleeve bands. Zip hoodie: centre zip line and two zip-pull dots at the top. Low-rise jeans: use torso hem: belt for a plain square buckle at the waist, star or butterfly shapes as flat appliques away from seams."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#F7B6D2", shadow: "#B28397", highlight: "#F8C3DA"}
      - {base: "#8FD3FF", shadow: "#6798B8", highlight: "#A3DBFF"}
      - {base: "#C9CED6", shadow: "#91949A", highlight: "#D3D7DD"}
      - {base: "#B8F04A", shadow: "#84AD35", highlight: "#C5F36B"}
  avoid: [skin-coloured midriff fill, very low rise that reads as underwear, rhinestone brand monograms]

- id: gorpcore
  name: Gorpcore
  palette:
    - "#5B6B3A"  # olive
    - "#C8AD7F"  # tan
    - "#E8742A"  # orange
    - "#1F2E4D"  # navy
  shirts: [fleece zip, puffer vest over long sleeve, shell jacket]
  pants: [hiking pants, zip-off cargos]
  details: [toggles, zip pulls, hiking boots]
  keywords: [outdoor, hiking, fleece, puffer]
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Puffer: horizontal baffle seams every 12-16 px with a highlight on each puff and a shadow line in each seam; fleece: soft, low-contrast folds; hiking pants: knee articulation darts."
    build: "Fleece zip: contrast chest panel (yoke) above v~40, zip line to v~40 (quarter-zip) or full, chin guard at the neck. Puffer vest: baffles over a long-sleeve base colour on the arms. Hiking pants: zip-off line at knee (v~60) as a thin zip seam, toggle cords at hems."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#5B6B3A", shadow: "#424D2A", highlight: "#79865D"}
      - {base: "#C8AD7F", shadow: "#907D5B", highlight: "#D2BC96"}
      - {base: "#E8742A", shadow: "#A7541E", highlight: "#EC8D50"}
      - {base: "#1F2E4D", shadow: "#162137", highlight: "#47546D"}
  avoid: [mountain-peak logos resembling outdoor brands, half-dome chest marks]

- id: athleisure
  name: Athleisure
  palette:
    - "#151515"  # black
    - "#A6A6A6"  # heather grey
    - "#9CAF88"  # sage
    - "#C8A2C8"  # lilac
  shirts: [fitted zip jacket, sports tee, quarter-zip]
  pants: [joggers, track pants, leggings]
  details: [side piping, drawcord, running shoes]
  keywords: [gym, joggers, sporty]
  guide: guides/athleisure.md
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Close-fitting: few large folds, strong highlight down the front of the thigh and shoulder; joggers gather into bunched folds above the cuff."
    build: "Zip jacket: centre zip, stand collar 6 px, side piping 2 px in an accent colour along the outer faces (one stripe only, never three). Joggers: rib cuffs at the ankle, drawcord waistband. Leggings: no hem, colour runs into the shoe."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#151515", shadow: "#0F0F0F", highlight: "#3F3F3F"}
      - {base: "#A6A6A6", shadow: "#787878", highlight: "#B6B6B6"}
      - {base: "#9CAF88", shadow: "#707E62", highlight: "#AEBD9D"}
      - {base: "#C8A2C8", shadow: "#907590", highlight: "#D2B3D2"}
  avoid: [three-stripe side tape, swoosh-like curves, skin-tight skin-tone leggings, sports-bra-only tops]

- id: sporty-jersey
  name: Sporty jersey
  palette:
    - "#C8102E"  # bold primary (swap per design)
    - "#FFFFFF"  # contrast
    - "#0B1F3A"  # dark trim
  shirts: [invented football jersey, invented basketball jersey, track jacket]
  pants: [matching shorts over tights, track pants]
  details: [invented numbers, side stripes of original width, invented crest shapes]
  keywords: [jersey, track, sports]
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Loose mesh: almost no folds, light vertical drape; shorts flare slightly with a fold at the hem."
    build: "Jersey: V-neck or crew trim 4 px, invented number centred on the back (and smaller on the front chest), side panels in the second colour on the side faces. Track jacket: stand collar, zip, raglan contrast panel over the shoulder. Shorts over tights: shorts end at leg v~56, tights continue below."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#C8102E", shadow: "#900C21", highlight: "#D23B54"}
      - {base: "#FFFFFF", shadow: "#B8B8B8", highlight: "#FFFFFF"}
      - {base: "#0B1F3A", shadow: "#08162A", highlight: "#37475D"}
  avoid: [real team colours combined with crests, real league logos, player names, real numbers tied to famous players]

- id: old-money
  name: Old money / quiet luxury
  palette:
    - "#F2E8D5"  # cream
    - "#C19A6B"  # camel
    - "#1C2A4A"  # navy
    - "#2E4A36"  # forest green
  shirts: [cable-knit sweater, polo, blazer over shirt]
  pants: [tailored trousers, pleated slacks]
  details: [collar, buttons, belt, loafers]
  keywords: [old money, classy, elegant]
  guide: guides/preppy.md
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Structured knits: cable ridges cast thin shadows on their left side; trousers keep a crisp centre crease highlight down the front of each leg."
    build: "Cable-knit: two vertical cable columns per front panel (twisted ropes drawn as alternating S-curves), rib hem 10 px. Polo: 3-button placket 8 px wide to v~30, flat collar with a 1 px shadow under its edge. Trousers: front crease line, belt 4 px with a plain buckle, loafers in brown."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#F2E8D5", shadow: "#AEA799", highlight: "#F4ECDD"}
      - {base: "#C19A6B", shadow: "#8B6F4D", highlight: "#CCAC86"}
      - {base: "#1C2A4A", shadow: "#141E35", highlight: "#45506B"}
      - {base: "#2E4A36", shadow: "#213527", highlight: "#546B5A"}
  avoid: [polo-player or animal chest emblems, monogram belt buckles, designer check patterns]

- id: preppy-varsity
  name: Preppy / varsity
  palette:
    - "#1C2A4A"  # navy
    - "#7A1F2B"  # burgundy
    - "#FFFFFF"  # white
    - "#2E6B3F"  # green
  shirts: [varsity jacket with invented letter, sweater vest over shirt, rugby stripe shirt]
  pants: [chinos, pleated skirt with socks]
  details: [ribbed cuffs, patch shapes, loafers]
  keywords: [preppy, varsity, school]
  guide: guides/preppy.md
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Wool body is matt with soft folds; leather-look sleeves (varsity) get sharp elbow highlights."
    build: "Varsity jacket: body colour + contrasting sleeves, striped rib collar/cuffs/hem (2-3 stripes), snap buttons as small dots down the centre, invented single letter patch on the chest (felt look, not a real school). Sweater vest: V-neck over a collared shirt (collar points visible). Rugby shirt: wide horizontal stripes, white collar."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#1C2A4A", shadow: "#141E35", highlight: "#45506B"}
