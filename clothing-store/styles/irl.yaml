  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Technical shells: sharp angular folds, panel lines carry the shading; straps cast 1-2 px shadows."
    build: "Shell jacket: asymmetric zip, taped seams (1 px lighter lines) along panels, high collar. Strapped vest: 2 chest straps with flat buckles, side release buckles. Cargos: articulated knee panel, strap at thigh with buckle, tapered ankle with cuff zip."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
