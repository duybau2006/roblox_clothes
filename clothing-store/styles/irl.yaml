  pants: [wide drop-crotch-look trousers, long dark skirt over trousers-look tights, washed black jeans]
  details: [long hems, monochrome layering, raw-look hems, heavy boots]
  keywords: [archive, avant garde, dark, minimal, layered]
  guide: guides/archive.md
  construction:
    source: "garment-construction knowledge; added 2026-11-16 with the style guides"
    folds: "Washed fabrics: few, long vertical folds; layering shows as hard shadow lines where one garment ends over another."
    build: "Long tee: torso.hem_line 116-120 with hem: plain (a long hemline is the archive signature). Layering: arms.sleeves short + arms.under in a second dark fabric. Trousers: waistband none or plain, solid charcoal, boots (shoe_palette black/charcoal). Keep it monochrome: 2-3 tones of black/grey plus bone."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#1A1A1A", shadow: "#131313", highlight: "#434343"}
      - {base: "#3A3A3A", shadow: "#2A2A2A", highlight: "#5D5D5D"}
      - {base: "#8A8580", shadow: "#63605C", highlight: "#9F9B97"}
      - {base: "#E8E4DC", shadow: "#A7A49E", highlight: "#ECE9E2"}
  avoid: [designer names or logos, replica of a specific runway piece, distress that shows skin, occult or religious symbols]

