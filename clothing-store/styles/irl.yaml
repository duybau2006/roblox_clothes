- id: minimalist
  name: Minimalist
  palette:
    - "#FAFAFA"  # white
    - "#121212"  # black
    - "#D9CBB0"  # beige
    - "#A8A39A"  # stone
  shirts: [plain heavyweight tee, crewneck, overshirt]
  pants: [straight trousers, clean jeans]
  details: [subtle seams only, white sneakers]
  keywords: [basic, clean, plain]
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Quiet: only the shared shading. Quality comes from clean hems and precise seams."
    build: "Heavyweight tee: thick 5 px crew rib, sleeve hem stitch line. Overshirt: two flap chest pockets, concealed placket line. Straight trousers: side seam only, slight break above white sneakers."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#FAFAFA", shadow: "#B4B4B4", highlight: "#FBFBFB"}
      - {base: "#121212", shadow: "#0D0D0D", highlight: "#3D3D3D"}
      - {base: "#D9CBB0", shadow: "#9C927F", highlight: "#E0D4BE"}
      - {base: "#A8A39A", shadow: "#79756F", highlight: "#B8B4AC"}
  avoid: [flat fills with no shading layer, beige that reads as skin tone]

- id: grunge
  name: Grunge
  palette:
    - "#141414"  # black
    - "#3A3A3A"  # charcoal
    - "#9B3B3B"  # faded red
    - "#5E6B47"  # moss
  shirts: [flannel over dark tee, ripped sweater]
  pants: [ripped jeans, black skinny jeans, black baggy jeans]
  details: [plaid, frayed hems, chains, combat boots]
  keywords: [grunge, flannel, ripped]
  guide: guides/grunge.md
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Worn: creases sit wherever fabric bunches (elbows, knees, waist) and rips show a darker inner edge and frayed white threads (never skin)."
    build: "Flannel: plaid (base_pattern: plaid) left open over a dark tee: two front panels with button placket edges, the tee visible down the centre. Ripped jeans: knee rips drawn as a dark gap with horizontal white thread lines over a darker denim backing. Chain: small linked ovals from belt loop to back pocket."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#141414", shadow: "#0E0E0E", highlight: "#3E3E3E"}
      - {base: "#3A3A3A", shadow: "#2A2A2A", highlight: "#5D5D5D"}
      - {base: "#9B3B3B", shadow: "#702A2A", highlight: "#AD5E5E"}
      - {base: "#5E6B47", shadow: "#444D33", highlight: "#7B8668"}
  avoid: [band names or band-style logos, rips over chest or hips that show skin, gore-style distress]

- id: coquette
