# Owner-generated motif sheets (ChatGPT, 2026-11-16): one entry per element, in contact-sheet order.
# Imported:  [x0, y0, x1, y1, id, motif tag, styles, type, placement, families, moods]
# Held:      [x0, y0, x1, y1, id, HOLD, reason]
# Boxes are sheet pixels (hand-checked against the auto-detected contact sheets; overlapping boxes are split
# by keeping only the connected pieces whose centre lies inside the box).
# styles: gz y2k vg emo bad gr xm sg prep ath cc arc      type: hero motif border swatch part texture
# placement: chest back sleeve hem allover               families: d (decorated) p (print) r (realistic)
reasons:
  cross: "cross, or contains one"
  halo: "halo / religious symbol"
  nude: "human figure, unclothed or suggestive"
  skull3: "three-skull group, too close to existing commercial shirt prints"
  fairy: "hooded fairy silhouette, too close to existing commercial shirt prints"
  brand: "resembles a real brand or logo"
  money: "banknotes / money"
  lips: "lips"
  blood: "blood drops"
  wound: "reads as a wound"
  words: "letters, words or digit strings (not a plain jersey number)"
  occult: "reads as a pentagram"
# Readability decided by eye on inbox/contact/sheet-NN-scale.png where the automatic test was wrong.
overrides:
  g03-spider-web: print-size only
  g02-orbit-swirl: print-size only
  g02-orbit-swirl-2: print-size only
  g02-dotted-butterfly: print-size only
  g02-sparkle-cluster: print-size only
