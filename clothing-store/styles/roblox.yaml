# Style library B: Roblox-native styles.
# Verified 2026-11-16 against the bestselling Classic Shirts / Classic Pants (see trends/2026-11-16-catalog.md).
# Ordered by catalog_hits = unique paid bestseller items (out of 156) whose name signals the style.
# unverified: true = never appeared in the bestseller sample. Design these only with a specific reason (e.g. group ranks, roleplay games).
# added: 2026-11-16 = style was not on the starting list and appeared 3+ times.

- id: y2k-crop-cargo
  name: Y2K crop and cargo
  catalog_hits: 54
  palette:
    - "#111111"  # black
    - "#FF69B4"  # pink
    - "#FFFFFF"  # white
    - "#8A8A8A"  # grey (or an original camo-like pattern base)
  shirts: [crop top, zip hoodie, baby tee, polka-dot or striped long sleeve]
  pants: [baggy cargos with belt and chunky shoes, star-print jeans, low-rise jeans]
  details: [belt, cargo pockets, chunky shoes, star shapes on jeans]
  keywords: [y2k, cargo, crop top, star jeans, cyber, 2000s]
  guide: guides/y2k.md
  construction:
    source: "garment-construction knowledge; not yet checked against browser references"
    folds: "Baggy cargos: big vertical folds, bellows pockets cast shadows; crop tops are fitted with small tension folds."
    build: "Crop top: torso.hem_line 84-92 with legs.waist_line up to 16 px lower (the gap shows the avatar, never skin-tone fabric); hem: plain or rib. See tests/specs/test-crop-top.yaml. Cargos: bellows pockets on outer thighs (v 40-72) with flap shadow, belt with chain, chunky shoes. Star jeans: flat star shapes spread around the legs, none crossing seams."
    palette_tones:   # base -> shadow (folds, seams) / highlight (chest, thigh, shoulder)
      - {base: "#111111", shadow: "#0C0C0C", highlight: "#3C3C3C"}
      - {base: "#FF69B4", shadow: "#B84C82", highlight: "#FF84C2"}
      - {base: "#FFFFFF", shadow: "#B8B8B8", highlight: "#FFFFFF"}
      - {base: "#8A8A8A", shadow: "#636363", highlight: "#9F9F9F"}
  avoid: [real military camo patterns, bare midriff drawn in skin tone, bra-like crop tops, the game names "da hood"/"dh" in names]

